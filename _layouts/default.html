<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title }} — {{ site.tagline }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="canonical" href="{{ site.url }}">
<meta property="og:title" content="{{ site.title }} — {{ site.tagline }}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}">
<meta name="twitter:card" content="summary_large_image">

{%- comment -%} Set the theme before first paint so there is no flash. {%- endcomment -%}
<script>(function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='%23f04e2e'/></svg>">
</head>
<body>
{{ content }}

<script>
(function(){
	var btn = document.querySelector('[data-theme-toggle]');
	if(!btn) return;
	btn.addEventListener('click', function(){
		var root = document.documentElement;
		var isDark = root.getAttribute('data-theme') === 'dark'
			|| (!root.hasAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
		var next = isDark ? 'light' : 'dark';
		root.setAttribute('data-theme', next);
		try { localStorage.setItem('theme', next); } catch(e) {}
	});
})();
</script>
</body>
</html>

# ═════════════════════════════════════════════════════════════════════════════
#  SUPPORT — the ways someone can back the work, or hire it.
#
#  Ordered by what is asked of the reader: free first, paid last. A card with
#  `status: soon` renders quietly and is not clickable, which is how something
#  that does not exist yet stays on the page without pretending to.
#
#    title / blurb   required
#    url             required unless status is `soon`
#    cta             the button's words
#    icon            an icon.html name
#    kind            free | paid | hire
#    status          live (default) | soon
#    featured        one card, drawn in the accent. Ration it.
# ═════════════════════════════════════════════════════════════════════════════

- title: The newsletter
  blurb: New posts, build logs and the occasional video, sent when there is
    something worth sending. No cadence promised, no filler.
  url: https://www.imswarnil.com/#/portal/signup
  cta: Subscribe free
  icon: mail
  kind: free
  featured: true

- title: Star something
  blurb: Every project here is public and most are MIT. A star is the cheapest
    signal that a thing is worth continuing.
  url: https://github.com/imswarnil
  cta: Browse the repos
  icon: star
  kind: free

- title: Buy the Ghost theme
  blurb: An editorial Ghost theme for creators who publish in more than one
    shape — writing, video and notes. One purchase, yours forever.
  url: https://theme.imswarnil.com
  cta: See the theme
  icon: spark
  kind: paid

- title: Sponsor a build
  blurb: Put your name on a project, a video or a repo. A single-tenant ad
    platform I run myself, so there is no network and no tracking.
  cta: Coming soon
  icon: badge
  kind: paid
  status: soon

- title: Work with me
  blurb: Salesforce and GTM engineering — CRM Analytics, CPQ, pipeline and
    product-usage data turned into dashboards people actually open.
  url: mailto:swarnilsinghaicse@gmail.com?subject=Working%20together
  cta: Start a conversation
  icon: briefcase
  kind: hire

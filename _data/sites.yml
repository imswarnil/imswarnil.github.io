# ═════════════════════════════════════════════════════════════════════════════
#  THE ONLY FILE YOU EDIT.
#  Add an entry here → a card appears on the page. Delete it → the card goes.
#  There is no collection, no generated page: every card links straight out.
#
#  FIELDS
#    title    required  the card's name
#    url      required  where the card sends you
#    blurb    required  one line, kept short — the grid is scannable, not read
#    kind     required  site | theme | project | code | video | social
#    span     optional  hero (2x2) | wide (2x1) | tall (1x2) | omit for 1x1
#    meta     optional  the mono line under the title — stack, role, whatever
#    status   optional  live | building | soon | archived   (default: live)
#    accent   optional  signal | craft   — signal is the record light. Ration it.
#    icon     optional  ghost | palette | book | layers | code | play | spark
#    tags     optional  [a, b, c] — small chips. Best on hero/wide cards only.
# ═════════════════════════════════════════════════════════════════════════════


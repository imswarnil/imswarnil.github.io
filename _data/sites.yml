# ═════════════════════════════════════════════════════════════════════════════
#  THE CARDS. Add an entry → a card appears. Delete it → the card goes.
#
#  FIELDS
#    title    required  the card's name
#    url      required  where the card sends you
#    blurb    required  one line, kept short — the grid is scannable, not read
#    kind     required  site | theme | project | code | tool
#    repo     optional  the GitHub repo name. Joins the card to live data:
#                       stars, language, last push. Repos listed here are left
#                       out of the automatic "everything else" section below.
#    span     optional  hero (2x2) | wide (2x1) | tall (1x2) | omit for 1x1
#    meta     optional  the small line under the blurb — stack, role, licence
#    status   optional  live | building | soon | archived   (default: live)
#    accent   optional  craft — the amber voice. Means "in progress", never "live".
#    icon     optional  ghost | palette | book | layers | code | play | spark
#                       | grid | briefcase | shield | badge | pen
#    tags     optional  [a, b, c] — chips. Best on hero and wide cards.
#
#  A screenshot appears on the card automatically if scripts/shots.mjs could
#  capture the url; otherwise the card draws its own cover. GitHub urls use
#  the repo's social image instead.
# ═════════════════════════════════════════════════════════════════════════════


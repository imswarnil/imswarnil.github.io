# ─────────────────────────────────────────────────────────────────────────────
#  links.imswarnil.com — the index of everything Swarnil builds.
#  One page. The cards come from _data/sites.yml, the socials from
#  _data/social.yml, and every number from _data/live/ (written by
#  scripts/fetch.mjs on each deploy — never edited by hand).
# ─────────────────────────────────────────────────────────────────────────────
title: Swarnil
tagline: Everything I build, on one page.
description: >-
  Every site, project, theme, post and video Swarnil Singhai has shipped —
  one page, one grid, live numbers, every link out.
url: https://links.imswarnil.com
author: Swarnil Singhai
github: imswarnil

# Optional — a browser-restricted YouTube Data API key lets the subscriber
# count refresh live in the visitor's browser. Leave blank and the number is
# the one fetched at the last deploy. Restrict the key to this domain in Google
# Cloud before pasting it here; it is public by design, like the site itself.
youtube_public_key: ""

plugins: []
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - package.json
  - package-lock.json
  - node_modules
  - scripts
  - vendor
  - .env
  - .env.example

sass:
  style: compressed

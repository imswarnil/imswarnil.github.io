name: Build and deploy

# The page shows live numbers, so it is rebuilt on a schedule as well as on
# push. Every secret is read here and only here; nothing is written back to the
# repository. Settings → Pages → Source must be "GitHub Actions".
on:
  push: { branches: [main] }
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3', bundler-cache: true }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - run: npm ci

      - name: Fetch live data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHOST_URL: ${{ secrets.GHOST_URL }}
          GHOST_CONTENT_KEY: ${{ secrets.GHOST_CONTENT_KEY }}
          GHOST_ADMIN_KEY: ${{ secrets.GHOST_ADMIN_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL: ${{ secrets.YOUTUBE_CHANNEL }}
        run: npm run fetch

      # Chooses each card's cover motif from the README fetched above. Pure
      # computation, so it must run after fetch and before the build.
      - name: Choose cover art
        run: npm run covers

      - name: Screenshot the live sites
        run: |
          npx playwright install --with-deps chromium
          npm run shots

      - name: Build
        env: { JEKYLL_ENV: production }
        run: bundle exec jekyll build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
